services:
  turntable:
    build: .
    image: turntable-sendspin:latest
    container_name: turntable-sendspin
    restart: unless-stopped
    ports:
      - "8383:8383"
      - "8928:8928"
    volumes:
      - /mnt/user/appdata/turntable/ssh:/config/ssh:ro
    environment:
      TURNTABLE_NAME: ${TURNTABLE_NAME:-Turntable}
      PI_HOST: ${PI_HOST:-raspberrypi.local}
      PI_USER: ${PI_USER:-pi}
      PI_AUDIO_DEVICE: ${PI_AUDIO_DEVICE:-plughw:CARD=Device,DEV=0}
      AUDIO_RATE: ${AUDIO_RATE:-48000}
      AUDIO_CHANNELS: ${AUDIO_CHANNELS:-2}
      MA_URL: ${MA_URL:-}
      MA_TOKEN: ${MA_TOKEN:-}
      MA_ENTITY: ${MA_ENTITY:-}
      AUDD_TOKEN: ${AUDD_TOKEN:-}
      AUTO_RECOGNIZE: ${AUTO_RECOGNIZE:-true}
      RECOGNITION_INTERVAL: ${RECOGNITION_INTERVAL:-30}
      CAPTURE_CHUNK_MS: ${CAPTURE_CHUNK_MS:-100}
      CAPTURE_BUFFER_MS: ${CAPTURE_BUFFER_MS:-400}
      ARECORD_BUFFER_US: ${ARECORD_BUFFER_US:-500000}
      ARECORD_PERIOD_US: ${ARECORD_PERIOD_US:-100000}
      SENDSPIN_PAIRING_CODE: ${SENDSPIN_PAIRING_CODE:-}
